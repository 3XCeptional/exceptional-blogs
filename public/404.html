<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Exceptional Blogs</title>
    <!--
      GitHub Pages has no server-side rewrites, so a direct load or refresh
      of a client-routed URL (e.g. /exceptional-blogs/2026-08-23-x.html)
      lands here. Encode the real path into a query string and redirect to
      index.html, which decodes it back before React mounts.
      pathSegmentsToKeep = 1 because this is a project page served under
      /exceptional-blogs/, not a user/org root page.
      https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
