<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exceptional Blogs</title>
    <meta
      name="description"
      content="Research-backed articles on AI security, careers, and technology, written for anyone who lands here."
    />
    <!--
      GitHub Pages SPA routing fallback. 404.html redirects here with the
      real path encoded in the query string; this decodes it back into a
      clean history entry before React mounts, so direct links and shares
      to /exceptional-blogs/2026-08-23-some-article.html work correctly.
      https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, "", l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
